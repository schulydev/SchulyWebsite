  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is Schuly?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Schuly is a free, open-source and unofficial app for students in Switzerland. It shows grades, exams, timetable, absences and documents from your school portal in a modern interface and lets you keep several school accounts in one app. Available for Android and iOS."
        }
      },
      {
        "@type": "Question",
        "name": "Which school systems are supported?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Schulnetz (via the Schulware plugin) and OdA Org. Each system is connected through a backend plugin, so more can be added without an app update. A read-only Microsoft 365 connection can be linked in the settings and is still being built out."
        }
      },
      {
        "@type": "Question",
        "name": "Is Schuly an official app of Schulnetz or my school?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Schuly is an unofficial, independent project. It is not affiliated with, endorsed by or operated by Centerboard AG (the maker of Schulnetz), your school, OdA Org or Microsoft."
        }
      },
      {
        "@type": "Question",
        "name": "How much does Schuly cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Nothing. Schuly is free, and the source code of the app, backend, plugins and this website is public on GitHub at github.com/schulydev."
        }
      },
      {
        "@type": "Question",
        "name": "Where is my data stored?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "That depends on the mode. In account mode the Schuly server stores your synced school data, and your school login data encrypted in a vault, so it can sync in the background. In private mode your login stays on your phone and requests pass through the Schuly server without being stored. Details are in the privacy policy."
        }
      },
      {
        "@type": "Question",
        "name": "Does Schuly know my school password?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "For Schulnetz, your email and password are only used to sign in and are not stored; Schuly keeps the resulting session encrypted. For OdA Org, username and password are stored encrypted so Schuly can sign in again. In private mode all of this stays on your device. Your Schuly account itself is managed by Schuly's own sign-in service at auth.schuly.dev."
        }
      },
      {
        "@type": "Question",
        "name": "Can my school system be integrated?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Possibly. The backend loads plugins that each connect one school system, using its API where one exists or reading its web portal otherwise. Once a plugin is installed, the system appears in the app's school list. Plugins are written against the Schuly plugin SDK on GitHub."
        }
      },
      {
        "@type": "Question",
        "name": "I don't want to trust Schuly with my data. What can I do?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Use private mode: there is no Schuly account and nothing about your school data is stored on the Schuly server. You can also run your own backend and point the app at it under \"Self-hosted\". All source code is public on GitHub at github.com/schulydev, so you can check how your data is handled."
        }
      },
      {
        "@type": "Question",
        "name": "Can I contribute?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Every component lives on GitHub at github.com/schulydev. Issues labelled \"bug\" or \"feature\" are the easiest place to start, and contributions are welcome."
        }
      }
    ]

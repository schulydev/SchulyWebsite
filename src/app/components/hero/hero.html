<section id="top" class="hero">
  <div class="hero-bg" aria-hidden="true">
    <div class="hero-dots"></div>
    <canvas #field class="hero-field"></canvas>
    <div class="hero-glow"></div>
  </div>

  <div class="hero-content">
    <h1 class="hero-title">
      <span class="hero-title-line">{{ 'hero.title1' | translate }}</span>
      <span class="hero-title-line hero-title-dim">{{ 'hero.title2' | translate }}</span>
    </h1>

    <p class="hero-sub">{{ 'hero.sub' | translate }}</p>

    <div class="hero-actions">
      <a [href]="base() + '#download'" class="btn btn-primary">
        {{ 'hero.ctaDownload' | translate }}
        <fa-icon [icon]="faArrowRight" class="btn-arrow" aria-hidden="true"></fa-icon>
      </a>
      <a href="https://app.schuly.dev" class="btn btn-secondary">
        <fa-icon [icon]="faGlobe" aria-hidden="true"></fa-icon>
        {{ 'hero.ctaWeb' | translate }}
      </a>
      <a href="https://github.com/schulydev/Schuly" target="_blank" rel="noopener" class="btn btn-ghost">
        <fa-icon [icon]="faGithub" aria-hidden="true"></fa-icon>
        {{ 'hero.ctaGithub' | translate }}
      </a>
    </div>

  </div>

  <div class="hero-stage">
    <!-- Laptop frame: "MacBook Pro 16-inch - Space Gray" from Pomme Plate (CC0); see CREDITS.txt. -->
    <figure class="laptop">
      <img
        class="laptop-frame"
        src="/assets/laptop-frame-1100.webp"
        srcset="/assets/laptop-frame-1100.webp 1100w, /assets/laptop-frame-2200.webp 2200w"
        sizes="(max-width: 1200px) 92vw, 1030px"
        width="1100"
        height="629"
        alt=""
        fetchpriority="high"
      />
      <div class="laptop-screen">
        <img
          class="laptop-shot"
          ngSrc="/assets/webapp-overview-dark.webp"
          width="1424"
          height="890"
          priority
          [alt]="'hero.webAlt' | translate"
        />
      </div>
    </figure>

    <figure class="phone">
      <picture>
        <source type="image/webp" srcset="/assets/schuly-start-page.webp" />
        <img
          src="/assets/schuly-start-page.png"
          width="660"
          height="1394"
          decoding="async"
          [alt]="'screenshots.alts.start' | translate"
        />
      </picture>
    </figure>
  </div>
</section>

<section id="top" class="hero">
  <div class="hero-bg" aria-hidden="true">
    <div class="hero-dots"></div>
    <canvas #field class="hero-field"></canvas>
    <div class="hero-glow"></div>
  </div>

  <div class="hero-content">
    <a href="https://app.schuly.dev" class="hero-badge">
      <span class="hero-badge-dot" aria-hidden="true"></span>
      <span>{{ 'hero.badge' | translate }}</span>
      <fa-icon [icon]="faArrowRight" class="hero-badge-arrow" aria-hidden="true"></fa-icon>
    </a>

    <h1 class="hero-title">
      <span class="hero-title-line">{{ 'hero.title1' | translate }}</span>
      <span class="hero-title-line hero-title-dim">{{ 'hero.title2' | translate }}</span>
    </h1>

    <p class="hero-sub">{{ 'hero.sub' | translate }}</p>

    <div class="hero-actions">
      <a [href]="base() + '#download'" class="btn btn-primary">
        {{ 'hero.ctaDownload' | translate }}
        <fa-icon [icon]="faArrowRight" class="btn-arrow" aria-hidden="true"></fa-icon>
      </a>
      <a href="https://app.schuly.dev" class="btn btn-secondary">
        <fa-icon [icon]="faGlobe" aria-hidden="true"></fa-icon>
        {{ 'hero.ctaWeb' | translate }}
      </a>
      <a href="https://github.com/schulydev/Schuly" target="_blank" rel="noopener" class="btn btn-ghost">
        <fa-icon [icon]="faGithub" aria-hidden="true"></fa-icon>
        {{ 'hero.ctaGithub' | translate }}
      </a>
    </div>

    <ul class="hero-platforms" [attr.aria-label]="'hero.platformsLabel' | translate">
      <li><fa-icon [icon]="faAndroid" aria-hidden="true"></fa-icon> Android</li>
      <li><fa-icon [icon]="faApple" aria-hidden="true"></fa-icon> iOS</li>
      <li><fa-icon [icon]="faGlobe" aria-hidden="true"></fa-icon> Web</li>
    </ul>
  </div>

  <div class="hero-stage">
    <figure class="browser">
      <div class="browser-bar" aria-hidden="true">
        <span class="browser-dots"><i></i><i></i><i></i></span>
        <span class="browser-url">
          <fa-icon [icon]="faLock"></fa-icon>
          app.schuly.dev
        </span>
        <span class="browser-spacer"></span>
      </div>
      <img
        class="browser-shot"
        ngSrc="/assets/webapp-overview-dark.webp"
        width="1424"
        height="900"
        priority
        [alt]="'hero.webAlt' | translate"
      />
    </figure>

    <figure class="phone">
      <picture>
        <source type="image/webp" srcset="/assets/schuly-start-page.webp" />
        <img
          src="/assets/schuly-start-page.png"
          width="800"
          height="1733"
          decoding="async"
          [alt]="'screenshots.alts.start' | translate"
        />
      </picture>
    </figure>
  </div>
</section>

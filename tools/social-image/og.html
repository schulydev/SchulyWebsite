<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url(/fonts/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: Inter, system-ui, sans-serif;
    color: #f1f2f4;
    background:
      radial-gradient(60% 70% at 85% 30%, rgba(8, 136, 248, 0.28), transparent 70%),
      radial-gradient(50% 60% at 0% 100%, rgba(78, 168, 255, 0.10), transparent 70%),
      #07080a;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, transparent 60%);
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 44px; }
  .brand img { width: 64px; height: 64px; border-radius: 16px; }
  .brand span { font-size: 34px; font-weight: 650; letter-spacing: -0.03em; }
  h1 { font-size: 64px; line-height: 1.04; font-weight: 640; letter-spacing: -0.045em; }
  h1 .dim { display: block; color: #8a8f99; }
  p { margin-top: 28px; font-size: 22px; line-height: 1.45; color: #a3a7b0; }
  .shot {
    position: absolute; left: 640px; top: 92px; width: 760px; height: 476px;
    border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.13);
    box-shadow: 0 40px 120px -20px rgba(8,136,248,0.45), 0 0 0 8px rgba(255,255,255,0.03);
    background: #0a0b0e;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="/assets/app_icon_512.png" alt=""><span>Schuly</span></div>
    <h1>Alle deine Schulen,<span class="dim">in einer App.</span></h1>
    <p>Noten, Absenzen und Stundenplan aus Schulnetz und OdA Org. Android, iOS und Web.</p>
  </div>
  <div class="shot"><img src="/assets/webapp-overview-dark.webp" alt=""></div>
</body>
</html>
